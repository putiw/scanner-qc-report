function render(){chart.replaceChildren();const compareMB=compare.value==='mb';document.getElementById('mb-controls').hidden=compareMB;document.getElementById('tr-controls').hidden=!compareMB;document.getElementById('solid-label').textContent=compareMB?'MB4':'TR 2 s';document.getElementById('dashed-label').textContent=compareMB?'MB8':'TR 0.75 s';const conditions=compareMB?[{protocol:'MB4_2p5mm',tr:fixedTR,solid:true},{protocol:'MB8_2p04x2p04x2mm',tr:fixedTR,solid:false}]:[{protocol,tr:2,solid:true},{protocol,tr:.75,solid:false}];const scoreName=score.value==='full'?'Full-model R²':score.value==='nuisance'?'Nuisance R²':'Task R²',xmax=score.value==='task'?70:100;chart.setAttribute('aria-label',`Percentage of native ROI above ${scoreName} thresholds`);const n=DATA.rois[roi.value],W=1160,H=440,L=145,R=18,TOP=34,BOTTOM=43,GAPX=30,GAPY=28,SINGLE=score.value==='nuisance',PW=SINGLE?W-L-R:(W-L-R-2*GAPX)/3,PH=SINGLE?H-TOP-BOTTOM:(H-TOP-BOTTOM-2*GAPY)/3;
status.textContent=`${roi.value} · ${compareMB?`TR ${fixedTR} s`:protocol.startsWith('MB4')?'MB4':'MB8'} · ${n.toLocaleString()} common vertices · ${scoreName} · mean across 3 runs · hover for percentages`;
for(let bi=0;bi<(SINGLE?1:3);bi++)chart.appendChild(el('text',{x:L+bi*(PW+GAPX)+PW/2,y:18,'text-anchor':'middle','font-size':16},SINGLE?'Nuisance-only model':BNAMES[bi]));
chart.appendChild(el('text',{transform:`translate(14 ${TOP+(H-TOP-BOTTOM)/2}) rotate(-90)`,'text-anchor':'middle','font-size':14},'ROI above threshold (%)'));
chart.appendChild(el('text',{x:L+(W-L-R)/2,y:H-3,'text-anchor':'middle','font-size':14},`${scoreName} threshold (%)`));
for(let hi=0;hi<(SINGLE?1:3);hi++){const ty=TOP+hi*(PH+GAPY);for(let j=0;j<(SINGLE?0:RNAMES[hi].length);j++)chart.appendChild(el('text',{x:74,y:ty+PH/2+(j-.5)*16,'text-anchor':'middle','font-size':14},RNAMES[hi][j]));
for(let bi=0;bi<(SINGLE?1:3);bi++){const tx=L+bi*(PW+GAPX),x=t=>tx+PW*t/xmax,y=v=>ty+PH*(1-v/100),g=el('g',{'aria-label':`${RNAMES[hi].join(' ')} · ${BNAMES[bi]}`});chart.appendChild(g);
g.appendChild(el('path',{d:`M${tx},${ty}V${ty+PH}H${tx+PW}`,fill:'none',stroke:'#555','stroke-width':1.2,'vector-effect':'non-scaling-stroke'}));
for(const v of[0,50,100]){g.appendChild(el('line',{x1:tx-4,x2:tx,y1:y(v),y2:y(v),stroke:'#555','vector-effect':'non-scaling-stroke'}));if(bi===0)g.appendChild(el('text',{x:tx-8,y:y(v)+4,'text-anchor':'end','font-size':12},v));}
for(const t of(xmax===100?[0,25,50,75,100]:[0,20,40,60,70])){g.appendChild(el('line',{x1:x(t),x2:x(t),y1:ty+PH,y2:ty+PH+4,stroke:'#555','vector-effect':'non-scaling-stroke'}));if(hi===(SINGLE?0:2))g.appendChild(el('text',{x:x(t),y:ty+PH+19,'text-anchor':'middle','font-size':12},t));}
const series=[];for(const condition of conditions)for(const [scanner,color]of[['Prisma','#1ebced'],['Cima.X','#6ce84c']]){const item=DATA.curves.find(c=>c.metric===score.value&&c.roi===roi.value&&c.protocol===condition.protocol&&c.tr_s===condition.tr&&c.hrf===HRFS[hi]&&c.basis===BASES[bi]&&c.scanner===scanner);if(!item)throw Error('Missing curve');series.push(item);const vals=item.count_above_threshold.slice(0,xmax+1).map(v=>100*v/n);const path=el('path',{d:vals.map((v,t)=>`${t?'L':'M'}${x(t).toFixed(3)},${y(v).toFixed(3)}`).join(' '),fill:'none',stroke:color,'stroke-width':1.8,'stroke-dasharray':condition.solid?'':'5 3','vector-effect':'non-scaling-stroke','data-scanner':scanner,'data-tr':condition.tr,'data-protocol':condition.protocol,'data-comparison':compare.value});g.appendChild(path);}
const cursor=el('line',{y1:ty,y2:ty+PH,stroke:'#999','stroke-width':.8,'stroke-dasharray':'2 3',visibility:'hidden','vector-effect':'non-scaling-stroke'});g.appendChild(cursor);const overlay=el('rect',{x:tx,y:ty,width:PW,height:PH,fill:'transparent'});g.appendChild(overlay);
overlay.addEventListener('mousemove',event=>{const pt=chart.createSVGPoint();pt.x=event.clientX;pt.y=event.clientY;const q=pt.matrixTransform(chart.getScreenCTM().inverse()),th=Math.max(0,Math.min(xmax,Math.round(xmax*(q.x-tx)/PW)));cursor.setAttribute('x1',x(th));cursor.setAttribute('x2',x(th));cursor.setAttribute('visibility','visible');status.textContent=`${RNAMES[hi][0]} · ${BNAMES[bi]} · R² > ${th}%: `+series.map(c=>`${c.scanner} ${c.protocol.startsWith('MB4')?'MB4':'MB8'} ${c.tr_s}s ${(100*c.count_above_threshold[th]/n).toFixed(1)}%`).join(' · ');});overlay.addEventListener('mouseleave',()=>cursor.setAttribute('visibility','hidden'));
}}
}
compare.addEventListener('change',render);tr2.addEventListener('click',()=>{fixedTR=2;tr2.setAttribute('aria-pressed','true');tr075.setAttribute('aria-pressed','false');render()});tr075.addEventListener('click',()=>{fixedTR=.75;tr075.setAttribute('aria-pressed','true');tr2.setAttribute('aria-pressed','false');render()});roi.addEventListener('change',render);score.addEventListener('change',render);mb4.addEventListener('click',()=>{protocol='MB4_2p5mm';mb4.setAttribute('aria-pressed','true');mb8.setAttribute('aria-pressed','false');render()});mb8.addEventListener('click',()=>{protocol='MB8_2p04x2p04x2mm';mb8.setAttribute('aria-pressed','true');mb4.setAttribute('aria-pressed','false');render()});render();
</script></body></html>
